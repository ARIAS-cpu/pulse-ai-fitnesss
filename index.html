      (function() {
        const _origErr = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string' && (firstArg.includes('[vite] failed to connect to websocket') || firstArg.includes('[vite] connect'))) {
            return;
          }
          return _origErr.apply(console, arguments);
        };
      })();
    </script>

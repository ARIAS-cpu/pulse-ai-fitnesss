<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161e2e"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9ff55"/>
      <stop offset="50%" stop-color="#b6f047"/>
      <stop offset="100%" stop-color="#72db1a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b6f047" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#263346" stroke-width="3" opacity="0.6"/>

  <!-- Subtle glow aura -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.4"/>

  <!-- Pulse / ECG / Lightning AI Path -->
  <g filter="url(#glow)">
    <path d="M 80 256 L 160 256 L 205 140 L 255 370 L 305 210 L 340 290 L 370 256 L 432 256" 
          fill="none" 
          stroke="url(#pulseGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- AI sparkle nodes -->
  <circle cx="205" cy="140" r="10" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="255" cy="370" r="10" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="305" cy="210" r="8" fill="#ffffff"/>
  
  <!-- Subtle brand text or accent -->
  <circle cx="432" cy="256" r="8" fill="#b6f047"/>
</svg>
